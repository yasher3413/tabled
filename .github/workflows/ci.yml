name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # The build ingests live data when no database exists. Reuse the HTTP cache between runs so
      # CI stays polite to the upstream sources.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: source-cache-${{ github.run_id }}
          restore-keys: source-cache-
      - run: pnpm build

      - name: End-to-end and accessibility tests
        run: |
          pnpm exec playwright install --with-deps chromium webkit
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
